[project]
name = "beedumper"
version = "0.1.3"
description = "Exporting SupportBee data for better integration with other ticketing tools"
authors = [{ name = "Jorge Sanz", email = "jsanz@carto.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["supportbee", "backup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Customer Service",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "click>=8.1",
    "pathos>=0.3",
    "python-dateutil>=2.8",
    "pytz>=2023.3",
]

[project.urls]
Repository = "https://github.com/CartoDB/beedumper"

[project.scripts]
beedumper = "beedumper.cli:cli"

[dependency-groups]
dev = [
    "ipdb>=0.13",
    "ipython>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["beedumper", "config.template.yaml", "README.md", "LICENSE"]
